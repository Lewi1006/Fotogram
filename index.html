<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link rel="stylesheet" href="standard.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body onload="render()">
    <header>
      <section class="header">
        <div class="content">
          <div class="logo">
            <img
              id="fotogram-icon"
              src="./assets/icons/fotogram_icon.svg"
              alt="fotogram icon colorful petals"
            />
            <img
              id="fotogram-font"
              src="./assets/icons/fotogram_font.svg"
              alt="fotogram font white"
            />
          </div>
        </div>
      </section>
    </header>

    <main>
      <section class="headline-gallery">
        <div class="content">
          <article class="gallery-wrapper">
            <div class="headline">
              <h1>Leo's photos</h1>
            </div>

            <div id="img-gallery"></div>
          </article>
        </div>
      </section>

    <dialog aria-labelledby="img-title" id="myDialog">
     
    </dialog> 

    </main>

    <footer class="footer">
      <div class="content">
        <div class="footer-wrapper">
          <div class="da">
            <a href="https://developerakademie.com/" target="_blank"
              ><img
                id="da-logo"
                src="./assets/icons/da_icon.svg"
                alt="logo developer akademie"
            /></a>
            <a href="https://developerakademie.com/" target="_blank"
              ><img
                id="da-font"
                src="./assets/icons/da_font.svg"
                alt="white font developer akademie"
            /></a>
          </div>

          <div class="impressum">
            <img
              src="./assets/icons/copyright.svg"
              alt="copyright icon white"
            />

            <a href="impressum.html">
              <p>2023 Developer Akademie GmbH</p>
            </a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
